# kdblog 部署编排。
#
# 两个服务 + 两个持久卷：
# - db：PostgreSQL，数据落在 pgdata 卷，容器重建不丢
# - app：Next.js standalone，上传文件落在 uploads 卷（对应容器内 /app/uploads）
#
# 首次启动后需执行一次迁移与种子：
#   docker compose exec app pnpm db:deploy
#   docker compose exec app pnpm db:seed
# （种子需要 ADMIN_EMAIL / ADMIN_PASSWORD 环境变量）

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kdblog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必须设置}
      POSTGRES_DB: ${POSTGRES_DB:-kdblog}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 不对外暴露端口：只有同一 compose 网络内的 app 需要访问
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kdblog} -d ${POSTGRES_DB:-kdblog}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # 服务名 db 即容器内可解析的主机名
      DATABASE_URL: postgresql://${POSTGRES_USER:-kdblog}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-kdblog}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET 必须设置}
      # Auth.js 在反代后需要知道真实站点地址，否则回调地址会错
      AUTH_URL: ${NEXT_PUBLIC_SITE_URL}
      AUTH_TRUST_HOST: "true"
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL 必须设置}
      PREVIEW_SECRET: ${PREVIEW_SECRET:?PREVIEW_SECRET 必须设置}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  pgdata:
  uploads:
